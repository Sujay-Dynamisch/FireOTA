name: fireota
description: >-
  Over-the-air updates for Flutter with FireOTA: Dart code push on Android, asset and config
  updates on Android and iOS, signed releases, staged rollouts and automatic rollback.
version: 0.2.0
homepage: https://fireota.creoai.in
repository: https://github.com/Sujay-Dynamisch/FireOTA/tree/main/packages/flutter
issue_tracker: https://github.com/Sujay-Dynamisch/FireOTA/issues
documentation: https://fireota.creoai.in/docs/flutter
topics:
  - ota
  - code-push
  - updates
  - deployment
  - rollout

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.1.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.fireota.flutter
        pluginClass: FireOTAPlugin
      ios:
        pluginClass: FireOTAPlugin
